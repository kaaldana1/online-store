# Step 2 listing assistant settings. Edit freely; restart the bot after changes.

[ai]
model = "claude-opus-5-5"     # ~8-15 cents per item with the skill + searches (/spend shows real cost).
                              # "claude-haiku-5-5" is far cheaper if quality holds.
effort = "low"                # low | medium | high. Low is plenty for identifying and drafting.
price_in_per_mtok = 4.00      # $ per million input tokens (for the spend log)
price_out_per_mtok = 20.00    # $ per million output tokens
max_image_px = 1568           # photos are shrunk to this long edge before sending
# resale-lister skill (skills/resale-lister/). Web search is for identifying marks, patterns and
# style numbers only, never prices. It must be allowed for your API organization in the Claude
# Console; if it isn't, the bot drafts without it and says so on the intake card.
web_search = true
max_web_searches = 3          # per item
price_per_web_search = 0.01   # $10 per 1,000 searches (for the spend log)
strict_tool = true            # set false if the API ever rejects strict mode on submit_listing

[facebook]
# Shown on every Facebook packet. Keep it general (neighborhood / cross streets), never your address.
pickup_area = ""

[goal]
listings_per_day = 5
tz_offset_hours = -7          # Arizona (no daylight saving). Used for "today" counts.

[shipping]
# Days after a sale to get it in the mail, for the daily "to ship" digest. eBay: your handling time
# (it counts toward seller metrics). Poshmark: buyers can cancel after about 7 days (verify in the app).
ship_within_days = { ebay = 2, poshmark = 5, mercari = 3, depop = 3 }

[pricing]
# The "market price" is the typical SOLD price your mom enters from the comps link.
min_profit = 5.00             # skip a platform if it would net less than this
round_to_dollar = true        # $43.27 -> $43

# Where each platform lists, using the sold range she enters (low-high) and the typical price:
#   "median" = the typical sold price, "high" = top of the range, "low" = bottom of the range.
# eBay at the median; Poshmark near the top because buyers always offer; Facebook at the median.
[pricing.list_at]
ebay = "median"
poshmark = "high"
facebook = "median"

# Lowest offer to accept, same words, plus "keep" = the price that still nets keep_fraction of
# the list-price profit. Never below min_profit or the melt floor.
[pricing.floor_at]
ebay = "keep"
poshmark = "median"
facebook = "low"

# No range entered? "high" falls back to typical x this, and "low" to typical x low_fallback.
[pricing.multiplier]
poshmark = 1.15
low_fallback = 0.85

[pricing.floor]
keep_fraction = 0.75

# Share of the list price she usually ends up getting (offers, bundles). Platforms are ranked by
# profit at this price, not at list. Starting guesses from the review. Replace them with her real
# numbers after 30-50 sales.
[pricing.realization]
ebay = 0.93
poshmark = 0.85
facebook = 0.85

# Box, mailer, tape, tissue per shipped order. Not charged on Facebook local pickup.
[pricing.packaging]
usd = 1.00

# Melt-value floor for sterling and gold: grams / 31.1035 x purity x spot x dealer payout.
# Spot prices are set in Discord with /spot (e.g. /spot silver 31.20) and are flagged when stale.
[pricing.melt]
dealer_payout = 0.80
stale_after_days = 7

# Estimated shipping label by packed weight (rough USPS Ground Advantage). Edit to match reality.
[[pricing.label_estimate]]
max_lb = 0.5
usd = 5.00
[[pricing.label_estimate]]
max_lb = 1
usd = 6.00
[[pricing.label_estimate]]
max_lb = 2
usd = 8.50
[[pricing.label_estimate]]
max_lb = 5
usd = 12.00
[[pricing.label_estimate]]
max_lb = 1000
usd = 20.00
