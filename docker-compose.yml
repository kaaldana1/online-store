services:
  storebot:
    build: .
    container_name: storebot
    restart: unless-stopped        # comes back after crashes and Docker restarts
    env_file: bot/.env             # DISCORD_TOKEN, GUILD_ID, channel IDs
    ports:
      - "127.0.0.1:8765:8765"     # storage map: http://localhost:8765 (this computer only)
    volumes:
      - ./data:/app/data           # database lives on the host: store-system/data/store.db
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Poshmark auto-delist worker (automation/README.md). Starts and restarts with the bot.
  # Uses the login saved by `python automation/poshmark.py login` (run once on this computer).
  poshmark-worker:
    build:
      context: .
      dockerfile: automation/Dockerfile
    container_name: poshmark-worker
    hostname: poshmark-worker      # fixed name, so Chromium can clean up its own stale profile lock
    restart: unless-stopped
    env_file: bot/.env             # AUTO_DELIST, DISCORD_TOKEN, ALERTS_CHANNEL_ID
    user: "${WORKER_UID:-1000}:${WORKER_GID:-1000}"   # your Linux user, so files stay yours
    shm_size: "1gb"                # Chromium needs more shared memory than Docker's default
    volumes:
      - ./data:/app/data
      - ./browser-profiles:/app/browser-profiles
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
